<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: Georgia, "Times New Roman", serif; pointer-events: none; }

  #log {
    position: absolute; left: 20px; bottom: 70px; width: 520px;
    max-height: 55vh;                       /* вся история — с прокруткой */
    display: flex; flex-direction: column; gap: 2px;
    overflow-y: auto; overflow-x: hidden;
    pointer-events: auto;                   /* мышь работает только над лентой */
    user-select: text;                      /* текст истории можно выделять */
    padding-right: 2px;
    transition: opacity 0.4s ease;
    scrollbar-width: thin; scrollbar-color: #6d5730 transparent;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #6d5730; }
  #log:not(:hover)::-webkit-scrollbar-thumb { background: transparent; } /* ползунок виден при наведении */

  .line {
    flex: none;                             /* строки не сжимаются — скролл честный */
    padding: 3px 10px; font-size: 14px; color: #F5E6C8;
    background: rgba(10, 7, 4, .55); border-left: 2px solid #6d5730;
  }
  .line .name { color: #FFD700; }
  .line.system { color: #C9A227; font-style: italic; }
  .line.me { color: #B3A179; font-style: italic; }
  .line.pm { color: #E5D9BD; }
  .line.pm .name { color: #C9A227; }
  .line.cmd { color: #8D7B58; font-style: italic; }
  .line.cmd::before { content: "› "; color: #6d5730; }

  #inputwrap {
    position: absolute; left: 20px; bottom: 24px; width: 520px;
    background: rgba(10, 7, 4, .85); border: 1px solid #6d5730;
    display: none; align-items: center; pointer-events: auto;
  }
  #inputwrap.open { display: flex; }
  #inputwrap::before { content: "›"; color: #C9A227; padding: 0 4px 0 10px; font-size: 16px; }
  #msg {
    flex: 1; background: transparent; border: none; outline: none;
    color: #F5E6C8; font-size: 14px; font-family: inherit;
    padding: 8px 10px 8px 2px;
  }
  #msg::placeholder { color: #4f4433; }
</style>
</head>
<body>
  <div id="log"></div>
  <div id="inputwrap">
    <input id="msg" maxlength="128" autocomplete="off" spellcheck="false" placeholder="Введите сообщение…">
  </div>

<script>
  const logEl = document.getElementById("log");
  const wrap  = document.getElementById("inputwrap");
  const msg   = document.getElementById("msg");
  let inputOpen = false;

  // ---------- затухание ленты ----------
  const FADE_DURATION = 10000;
  let fadeTimer = null;

  function showLog() {
    if (fadeTimer) clearTimeout(fadeTimer);
    logEl.style.opacity = "1";
    fadeTimer = setTimeout(() => { logEl.style.opacity = "0.15"; }, FADE_DURATION);
  }

  // пока курсор или колесо над лентой — не затухаем и держим яркость
  logEl.addEventListener("mouseenter", showLog);
  logEl.addEventListener("wheel", showLog);
  logEl.addEventListener("mouseleave", showLog); // перезапускаем таймер затухания

  // клик по истории не должен рвать фокус открытого ввода
  logEl.addEventListener("mousedown", () => {
    if (inputOpen) setTimeout(() => { msg.focus(); }, 0);
  });

  // ---------- автоскролл ----------
  let stickBottom = true; // следим, не отмотал ли пользователь историю вверх

  logEl.addEventListener("scroll", () => {
    stickBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 20;
  });

  // ---------- история сообщений ----------
  const MAX_HISTORY = 150;

  function addLine(raw) {
    let d;
    try { d = typeof raw === "string" ? JSON.parse(raw) : (raw || {}); }
    catch (e) { d = { text: String(raw) }; }
    const el = document.createElement("div");
    el.className = "line" + (d.kind ? " " + d.kind : "");
    if (d.name) {
      const n = document.createElement("span");
      n.className = "name";
      n.textContent = d.name;
      el.appendChild(n);
      el.appendChild(document.createTextNode(": " + (d.text || "")));
    } else {
      el.textContent = d.text || "";
    }
    logEl.appendChild(el);
    while (logEl.children.length > MAX_HISTORY) logEl.removeChild(logEl.firstChild);
    if (stickBottom) logEl.scrollTop = logEl.scrollHeight; // едем вниз, если не читаем историю
    showLog();
  }

  window.addEventListener("chat:line", (e) => addLine(e.detail));
  window.addEventListener("chat:history", (e) => {
    let d;
    try { d = typeof e.detail === "string" ? JSON.parse(e.detail) : (e.detail || {}); }
    catch (err) { d = {}; }
    (d.lines || []).forEach(addLine);
    stickBottom = true;
    logEl.scrollTop = logEl.scrollHeight;
  });
  window.addEventListener("chat:notice", (e) => {
    let d;
    try { d = typeof e.detail === "string" ? JSON.parse(e.detail) : (e.detail || {}); }
    catch (err) { d = {}; }
    addLine({ kind: "system", text: d.message || d.text || "" });
  });

  // ---------- история команд (стрелки вверх/вниз в вводе) ----------
  const cmdHistory = [];
  let histIndex = -1;
  let draft = "";

  function remember(text) {
    if (cmdHistory[cmdHistory.length - 1] !== text) cmdHistory.push(text);
    if (cmdHistory.length > 50) cmdHistory.shift();
    histIndex = -1;
  }

  function historyUp() {
    if (!cmdHistory.length) return;
    if (histIndex === -1) { draft = msg.value; histIndex = cmdHistory.length - 1; }
    else histIndex = Math.max(0, histIndex - 1);
    msg.value = cmdHistory[histIndex];
    const l = msg.value.length;
    msg.setSelectionRange(l, l);
  }

  function historyDown() {
    if (histIndex === -1) return;
    histIndex++;
    if (histIndex >= cmdHistory.length) { histIndex = -1; msg.value = draft; }
    else msg.value = cmdHistory[histIndex];
    const l = msg.value.length;
    msg.setSelectionRange(l, l);
  }

  // ---------- открытие / закрытие ввода ----------
  window.addEventListener("chat:openInput", () => {
    inputOpen = true;
    wrap.classList.add("open");
    msg.value = "";
    showLog();
    setTimeout(() => { msg.focus(); }, 50);
  });

  window.addEventListener("chat:closeInput", () => {
    inputOpen = false;
    wrap.classList.remove("open");
    msg.blur();
  });

  // ---------- отправка и закрытие ----------
  function call(name, payload) {
    try { callEvent(name, payload); }
    catch (e) { try { callEvent(name, JSON.stringify(payload)); } catch (e2) {} }
  }

  function send() {
    const text = msg.value.trim();
    if (!text) return;
    remember(text);
    //if (text.startsWith("/")) addLine({ kind: "cmd", text }); // команды видны в истории у автора
    call("chat:input", JSON.stringify({ text }));
    msg.value = "";
  }

  function requestClose() {
    wrap.classList.remove("open");
    msg.blur();
    call("chat:close", JSON.stringify({}));
  }

  // Enter ловим на ВСЕЙ странице — даже если фокус слетел с поля
  document.addEventListener("keydown", (e) => {
    if (!inputOpen) return;
    if (e.key === "Enter" || e.keyCode === 13) {
      e.preventDefault();
      if (!msg.value.trim()) { inputOpen = false; requestClose(); return; }
      send();
    } else if (e.key === "Escape" || e.keyCode === 27) {
      e.preventDefault();
      msg.value = "";
      inputOpen = false;
      requestClose();
    }
  });

  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.keyCode === 13) {
      e.preventDefault();
      e.stopPropagation();
      if (!msg.value.trim()) { inputOpen = false; requestClose(); return; }
      send();
    } else if (e.key === "ArrowUp" || e.keyCode === 38) {
      e.preventDefault();
      historyUp();
    } else if (e.key === "ArrowDown" || e.keyCode === 40) {
      e.preventDefault();
      historyDown();
    }
  });

  showLog();
</script>
</body>
</html>
